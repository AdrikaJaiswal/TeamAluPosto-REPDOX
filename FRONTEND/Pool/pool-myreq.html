<!DOCTYPE html>

    <main class="mobile-container page-bg-image pool-layout">

                </button>

                    <line x1="3" y1="12" x2="21" y2="12"></line>

            <a href="pool-create.html" class="btn-new" style="text-decoration: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

                <div class="left-col">
                    <h3 class="item-title">MANGOES</h3>

                <div class="right-col">
                    <p class="date-text">20/06/2026</p>

                    <p class="item-subtext">Sacks</p>
                    <span class="status-badge requests-count">2 Requests</span>
