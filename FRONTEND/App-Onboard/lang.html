<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Language</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="lang.css">
</head>
<body>

    <main class="mobile-container page-bg-image page-language-layout">
        
        <div class="card-positioning-wrapper">
            <form id="language-form" class="floating-card">
                <h1 class="page-title">LANGUAGE</h1>
                
                <div class="options-scroll-area">
                    <label class="lang-option">
                        <input type="radio" name="language" value="english" checked>
                        <span>English</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="assamese">
                        <span>অসমীয়া</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="bengali">
                        <span>বাংলা</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="bodo">
                        <span>बडो</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="dogri">
                        <span>डोगरी</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="gujarati">
                        <span>ગુજરાતી</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="hindi">
                        <span>हिंदी</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="kannada">
                        <span>ಕನ್ನಡ</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="kashmiri">
                        <span>कॉशुर / کٲشُر</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="konkani">
                        <span>कोंकणी</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="maithili">
                        <span>मैथिली</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="malayalam">
                        <span>മലയാളം</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="manipuri">
                        <span>മৈতৈলোন্</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="marathi">
                        <span>मराठी</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="nepali">
                        <span>नेपाली</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="odia">
                        <span>ଓଡ଼ିଆ</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="punjabi">
                        <span>ਪੰਜਾਬੀ</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="sanskrit">
                        <span>संस्कृतम्</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="santali">
                        <span>ᱥᱟᱱᱛᱟᱲᱤ</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="sindhi">
                        <span>सिंधी / سنڌي</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="tamil">
                        <span>தமிழ்</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="telugu">
                        <span>తెలుగు</span>
                    </label>
                    <label class="lang-option">
                        <input type="radio" name="language" value="urdu">
                        <span>اردو</span>
                    </label>
                </div>

                <div class="action-footer">
                    <button type="submit" class="btn-check" aria-label="Confirm Selection">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
