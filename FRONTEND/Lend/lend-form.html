<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrishiLink - Add New Equipment</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="lend-form.css">
    <script src="../yay.js" defer></script>
</head>
<body>

    <main class="mobile-container page-bg-image lend-new-layout">
        
        <div class="nav-drawer-overlay" id="sidebar-menu">
            <div class="drawer-content">
                <button class="drawer-close-btn" aria-label="Close menu" id="close-menu-trigger">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <nav class="drawer-links-group">
                    <a href="../home.html" class="drawer-link-item">HOME</a>
                    <a href="../Pool/pool.html" class="drawer-link-item">TRUCK POOL</a>
                    <a href="../Borrow/borrow.html" class="drawer-link-item">BORROW</a>
                    <a href="./lend.html" class="drawer-link-item">LEND</a>
                </nav>
            </div>
        </div>

        <header class="top-navbar">
            <button class="nav-menu-btn" aria-label="Open menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div class="profile-avatar">
                <svg viewBox="0 0 24 24" fill="#a3a3a3">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                </svg>
            </div>
        </header>

        <div class="subheader-bar">
            <button type="button" class="card-back-btn" aria-label="Go back" onclick="history.back()">
                <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <h2>LEND</h2>
        </div>

        <div class="card-positioning-wrapper">
            <form id="new-listing-form" class="floating-card">
                
                <div class="form-scroll-area">
                    
                    <div class="form-group">
                        <label for="eq-type">Equipment Type</label>
                        <input type="text" id="eq-type" name="equipmentType" placeholder="e.g. Tractor, Harvester, Tiller" required>
                    </div>

                    <div class="form-group">
                        <label for="eq-name">Equipment Name / Model</label>
                        <input type="text" id="eq-name" name="equipmentName" placeholder="e.g. Mahindra Yuvo 585" required>
                    </div>

                    <div class="form-group">
                        <label for="rental-price">Rental Price</label>
                        <div class="price-input-row">
                            <span class="currency-symbol">₹</span>
                            <input type="number" id="rental-price" name="rentalPrice" value="0" min="0" required>
                            <span class="price-suffix">per hr</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="available-date">Available Date</label>
                        <input type="date" id="available-date" name="availableDate" required>
                    </div>

                    <div class="form-group">
                        <label for="available-time">Available Start Time</label>
                        <input type="time" id="available-time" name="availableTime" required>
                    </div>

                </div>

                <div class="action-footer">
                    <button type="submit" class="btn-check" aria-label="Confirm Listing creation">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </button>
                </div>

            </form>
        </div>
    </main>
</body>
</html>
